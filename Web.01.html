<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Halaman dengan Tabel</title>
</head>
<body>

    <table border="1" style="border-collapse: collapse; border-color: #000000;">

        <tr style="background-color: #ffeadb;">
            <td colspan="2" style="padding: 20px; text-align: center;">
                <header>
                    HEADER
                </header>
            </td>
        </tr>

        <tr style="background-color: #dbe9ff;">
            <td colspan="2" style="padding: 15px; text-align: center;">
                <nav>
                    NAVIGASI 
                </nav>
            </td>
        </tr>

        <tr>
            <td style="padding: 50px; background-color:#ffe4e1; vertical-align:top; text-align: left;">
                <main>
                    <h1>Heading 1</h1>
                    <p>
                        Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor 
                        incididunt ut labore et dolore magna aliqua.
                    </p>
                </main>
            </td>
            <td style="width: 15%; background-color: #e2f0d9; vertical-align: top;">
                <aside>
                    <h3>Menu:</h3>
                    <ul>
                        <li>Home</li>
                        <li>Berita</li>
                        <li>Layanan</li>
                        <li>Kontak</li>
                    </ul>
                </aside>
            </td>
        </tr>

        <tr style="background-color: #f0daca46;">
            <td colspan="2" style="padding: 15px; text-align: left;">
                <footer>
                    FOOTER
                </footer>
            </td>
        </tr>

    </table>

</body>
</html>
